
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: qweasd
      MYSQL_DATABASE: mydatabase
      TZ: Asia/Taipei
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup:/backup
      - ./SqlTemplate:/SqlTemplate
    ports:
      - "3306:3306"
    networks:
      - main-network

  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
    volumes:
      - ./config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
    ports:
      - "8080:80"
    networks:
      - main-network



  backup:
    depends_on:
      - mysql
    build: ./backup
    container_name: backup
    environment:
      BACKUP_INTERVAL: 3600 # 設置備份間隔時間，單位為秒
      TZ: Asia/Taipei
    volumes:
      - ./backup:/backup
    entrypoint: /backup/backup.sh
    networks:
      - main-network

volumes:
  mysql_data:

networks:
  main-network:
    external: true
