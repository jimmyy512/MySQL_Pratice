
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    # performance_schema 是給 DBA 追效能用的監控，預設開著會先吃掉約 230MB 記憶體，這台主機沒人在看它（2026-09-30 關掉）
    command: ["mysqld", "--performance-schema=OFF"]
    # 原本沒設重啟策略，VPS 重開機後生活獵人的資料庫不會自己起來
    restart: unless-stopped
    environment:
      # 密碼放在同目錄不進版控的 .env，這個 repo 是公開的
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mydatabase
      TZ: Asia/Taipei
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup:/backup
      - ./SqlTemplate:/SqlTemplate
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - main-network

  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin:5.2.3
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
    volumes:
      - ./config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - main-network



  backup:
    depends_on:
      - mysql
    build: ./backup
    container_name: backup
    environment:
      BACKUP_INTERVAL: 3600 # 設置備份間隔時間，單位為秒
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Taipei
    volumes:
      - ./backup:/backup
    entrypoint: /backup/backup.sh
    networks:
      - main-network

volumes:
  mysql_data:

networks:
  main-network:
    external: true
